<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Customer.css?v=1.3">
    <title>Customer</title>
</head>
<body>

        <div class="container">
            <header>
                <div class="logo">Customer List</div>
                <div class="header-actions">
                    <div class="header-actions">
                        <button class="btn-secondary">
                            <i class='bx bx-printer'></i>
                            Print
                        </button>
                        <button class="btn-secondary">
                            <i class='bx bx-qr-scan'></i>
                            QR Scan
                        </button>
                        <button class="btn-primary">
                            <i class="fa-regular fa-square-plus"></i>
                            Add Sale
                        </button>
                    </div>
                </div>            
            </header>
    
            
            <div class="vendor-container">
                <div class="vendor-header">
                    <button><i class="fa-solid fa-filter"></i></button>
                    <div class="search-container">
                        <span class="search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <input type="text" class="search-input" placeholder="Search Vendor...">
                    </div>
            </div>
    
    <div class="main-container">
        <table id="customer-list">

        </table>
    </div>

    <script type="module" src="Customer.js?v=1.0.3"></script>
</body>
</html>
