<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Purchase.css">
    <title>PURCHASE</title>
</head>
<body>
    <nav class="nav">
        <div class="top-nav">
            <h1>PURCHASE LISTS</h1>
            <div class="nav-icons">
                <button><i class='bx bx-printer'></i></button>
                <button><i class="fa-regular fa-square-plus"></i></button>
            </div>
        </div>
        <div class="search-container">
            <button><i class="fa-solid fa-filter"></i></button>
            <div class="search-bar">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
                <input type="search" name="" id="" placeholder="Search Purchase">
            </div>
        </div>
    </nav>

    <div class="main-container">
        <table>
            <tr class="row-data">
                <div class="data">
                    <div class="data-left">
                        <img src="../Img/pfp.jpg" alt="">
                        <div class="left">
                            <h1 id="item-name">NIBBAFICATION</h1>
                            <p id="item-stock">69 pieces</p>
                        </div>
                    </div>
                    <div class="data-right">
                        <button><i class='bx bx-dots-horizontal-rounded'></i></button>
                        <p id="item-date">69 Days Ago</p>
                    </div>
                </div>
            </tr>
            <tr class="row-data">
                <div class="data">
                    <div class="data-left">
                        <img src="../Img/pfp.jpg" alt="">
                        <div class="left">
                            <h1 id="item-name">NIBBAFICATION</h1>
                            <p id="item-stock">69 pieces</p>
                        </div>
                    </div>
                    <div class="data-right">
                        <button><i class='bx bx-dots-horizontal-rounded'></i></button>
                        <p id="item-date">69 Days Ago</p>
                    </div>
                </div>
            </tr>
        </table>
    </div>
</body>
</html>
