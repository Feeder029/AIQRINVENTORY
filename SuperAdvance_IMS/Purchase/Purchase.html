<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Purchase.css?v=1.0.1">
    <title>PURCHASE</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">PURCHASE LISTS</div>
            <div class="header-actions">
                <div class="header-actions">
                    <button class="btn-secondary">
                        <i class='bx bx-printer'></i>
                        Print
                    </button>

                    <button class="btn-primary" popovertarget="addpurchase">
                        <i class="fa-regular fa-square-plus" ></i>
                        Add Purchase
                    </button>
                </div>
            </div>            
        </header>

        <div class="main-container">
            <div class="main-header">
                <button><i class="fa-solid fa-filter"></i></button>
                <div class="search-container">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search Purchase...">
                </div>
        </div>

        <table class="table" id="PurchasesList">
        </table>

    </div>


    <div class="popover" popover id="addpurchase">
      <div class="popover-header">
        <h3 class="popover-title">ADD PURCHASE</h3>
      </div>
      
      <div class="form-group">
        <label class="form-label">Item</label>
        <div class="custom-select">
          <div class="custom-select-trigger">
            <div class="item-icon">📄</div>
            <div class="item-details">
              <div class="item-name">Paper A4</div>
              <div class="item-stock">Current Stock: 25 reams</div>
            </div>
          </div>
          <div class="custom-select-options" style="display: none;">
            <div class="custom-option">
              <div class="item-icon">📄</div>
              <div class="item-details">
                <div class="item-name">Paper A4</div>
                <div class="item-stock">Current Stock: 25 reams</div>
              </div>
            </div>
            <div class="custom-option">
              <div class="item-icon">🖨️</div>
              <div class="item-details">
                <div class="item-name">Ink Cartridge</div>
                <div class="item-stock">Current Stock: 12 units</div>
              </div>
            </div>
            <div class="custom-option">
              <div class="item-icon">📎</div>
              <div class="item-details">
                <div class="item-name">Stapler</div>
                <div class="item-stock">Current Stock: 8 units</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Vendor</label>
        <div class="custom-select">
          <div class="custom-select-trigger">Select a vendor</div>
          <div class="custom-select-options" style="display: none;">
            <div class="custom-option">Office Supplies Co.</div>
            <div class="custom-option">Paper World</div>
            <div class="custom-option">Stationery Express</div>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Purchase Date</label>
        <input type="date" class="form-input" value="2025-05-15">
      </div>
      
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <label class="form-label">Amount</label>
            <input type="number" class="form-input" min="1" value="1">
          </div>
        </div>
        <div class="form-col">
          <div class="form-group">
            <label class="form-label">Unit Price ($)</label>
            <input type="number" class="form-input" min="0.01" step="0.01" value="12.99">
          </div>
        </div>
      </div>
      
      <div class="calculated-cost">
        Total Cost: $12.99
      </div>
      
      <button class="save-btn" type="button">Save Purchase</button>
    </div>



    <script type="module" src="purchase.js?v=1.0.1"></script>
</body>
</html>
