<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Item.css?v=1.0.13">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Item Inventory</div>
            <div class="header-actions">
                <button class="btn-secondary">
                    <i class='bx bx-printer'></i>
                    Print
                </button>
                <button class="btn-secondary">
                    <i class='bx bx-qr-scan'></i>
                    QR Scan
                </button>
                <button class="btn-primary" popovertarget="AddItem">
                    <i class="fa-regular fa-square-plus"></i>
                    Add Item
                </button>
            </div>
        </header>

        <div class="items-container">

            <div class="items-header">
                <button><i class="fa-solid fa-filter"></i></button>
                <div class="search-container">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search items...">
                </div>
            </div>

            <div class="main-container" id="items_display">
                <!-- JS ITEMS DISPLAY INPUT HERE -->
            </div>
    
        </div>

    </div>

    <div></div>

    <div popover id="AddItem">
        <input type="text" name="ProductName" id="ProductName" placeholder="Enter the Product Name">
        <input type="text" name="UnitPrice" id="UnitPrice" placeholder="Enter the Unit Price">
        <textarea name="Description" id="Description" placeholder="Enter the Description"></textarea>
        <input type="text" name="Quantity" id="Quantity" placeholder="Enter the Quantity">
        <input type="text" name="Discount" id="Discount" placeholder="Enter the Discount">
        <input type="file" id="Item-Img" name="Item-Img" accept="image/*" required>
        <button id="saveaddproduct" onclick="SaveItems()">SAVE</button>
      </div>
    

    
    <script type="module" src="item.js?v=1.7"></script>
</body>
</html>
