<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Item.css?v=1.1.7">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Item Inventory</div>
            <div class="header-actions">
                <button class="btn-secondary">
                    <i class='bx bx-printer'></i>
                    Print
                </button>
                <button class="btn-secondary">
                    <i class='bx bx-qr-scan'></i>
                    QR Scan
                </button>
                <button class="btn-primary" popovertarget="AddItem">
                    <i class="fa-regular fa-square-plus"></i>
                    Add Item
                </button>
            </div>
        </header>

        <div class="items-container">

            <div class="items-header">
                <button><i class="fa-solid fa-filter"></i></button>
                <div class="search-container">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search items...">
                </div>
            </div>

            <div class="main-container" id="items_display">

            </div>
    
            <div class="loading-message" id="loading" style="text-align: center; padding: 40px 20px; font-family: Arial, sans-serif; background: linear-gradient(to right, #f6f9fc, #e6f2ff); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
              <h2 style="color: #2c5282; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">Please wait while items are loading!</h2>
              <p style="color: #4a5568; margin: 20px 0; font-size: 16px;">We are currently synchronizing items with our legacy database. The more new items there are, the longer this process will take.</p>
              <div class="loading-spinner" style="margin: 30px auto; width: 60px; height: 60px; border: 6px solid #e2e8f0; border-top: 6px solid #4299e1; border-right: 6px solid #48bb78; border-bottom: 6px solid #ed8936; border-radius: 50%; animation: spin 1.5s linear infinite;"></div>
              <p style="color: #805ad5; font-weight: bold; margin-top: 20px;">Thank you for your patience!</p>
              <style>
                  @keyframes spin {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(360deg); }
               }
              </style>
            </div>

        </div>


    </div>

    <div></div>

    <div popover id="AddItem">
        <div id="firstaddpage">
        <input type="text" name="ProductName" id="ProductName" placeholder="Enter the Product Name">
        <textarea name="Description" id="Description" placeholder="Enter the Description"></textarea>
        <input type="text" name="Quantity" id="Quantity" placeholder="Enter the Quantity">
        <input type="text" name="Discount" id="Discount" placeholder="Enter the Discount">
        <input type="file" id="Item-Img" name="Item-Img" accept="image/*" required>
        <button id="nextprice" onclick="Next()">NEXT</button>
        </div>

        <div id="secondaddpage" style="display: none;">
        <div id="pricesuggestion">
            <div id="loading"></div>
        </div>
        <input type="text" name="UnitPrice" id="UnitPrice" placeholder="Enter the Unit Price">
        <h6 class="alert"> LOL </h6>
        <button id="saveaddproduct" onclick="SaveItems()">SAVE</button>
        </div>

    </div>
    

    
    <script type="module" src="item.js?v=1.12"></script>
</body>
</html>
