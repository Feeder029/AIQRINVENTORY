<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Vendor.css">
    <title>VENDOR</title>
</head>
<body>
    <nav class="nav">
        <div class="top-nav">
            <h1>VENDOR LISTS</h1>
            <div class="nav-icons">
                <button><i class='bx bx-printer'></i></button>
                <button><i class="fa-regular fa-square-plus"></i></button>
            </div>
        </div>
        <div class="search-container">
            <button><i class="fa-solid fa-filter"></i></button>
            <div class="search-bar">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
                <input type="search" name="" id="" placeholder="Search Customer">
            </div>
        </div>
    </nav>
    
    <div class="main-container">
        <table>
            <tr id="table-head">
                <th>ID</th>
                <th>NAME</th>
                <th>EMAIL</th>
                <th id="head-mobile">MOBILE</th>
                <th id="head-phone2">PHONE 2</th>
                <th>ADDRESS</th>
                <th>ADDRESS 2</th>
                <th id="head-city">CITY</th>
                <th id="head-district">DISTRICT</th>
                <th id="head-status">STATUS</th>
                <th id="head-action">ACTION</th>
            </tr>
            <tr id="data">
                <td id="id">0005</td>
                <td id="name">NIBBA SYNTHESIS</td>
                <td id="email">nibba@gmail.com</td>
                <td id="mobile">0987654321</td>
                <td id="phone2">0987654321</td>
                <td id="address">Blk 123 lot 1 phs 2</td>
                <td id="address2">Blk 123 lot 1 phs 2</td>
                <td id="city">ARK</td>
                <td id="district">6</td>
                <td id="status"><button>ACTIVE</button></td>
                <td id="action">
                    <div class="action-icon">
                        <button><i class="fa-solid fa-pen-to-square"></i></button>
                        <button><i class="fa-solid fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
