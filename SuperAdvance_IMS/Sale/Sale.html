<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="sale.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Sales Dashboard</div>
            <div class="header-actions">
                <button class="btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Sale
                </button>
                <button class="btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Print
                </button>
            </div>
        </header>
        
        <div class="sales-summary">
            <div class="summary-card">
                <h3>Total Sales This Year</h3>
                <p>$24,568.00</p>
            </div>
            <div class="summary-card">
                <h3>This Month</h3>
                <p>$8,245.00</p>
            </div>
            <div class="summary-card">
                <h3>Total Orders</h3>
                <p>142</p>
            </div>
            <div class="summary-card">
                <h3>Average Order</h3>
                <p>$173.01</p>
            </div>
        </div>
        
        <div class="sales-container">
            <div class="sales-header">
                <h2 class="sales-title">Sales Information</h2>
                <div class="search-container">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search sales...">
                </div>
            </div>
            
            <div class="sales-grid" id="salesinfo">
                <!-- JS SALES DISPLAY INPUT HERE -->
            </div>
                <div class="pagination">
                <div class="page-info"></div>
                <div class="page-controls">
                    <button class="page-btn">Previous</button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                    <button class="page-btn">3</button>
                    <button class="page-btn">Next</button>
                </div>
        </div>
    </div>

    <script src="sale.js"></script>
</body>
</html>
